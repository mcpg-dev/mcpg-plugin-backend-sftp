schema: mcpg.dev/plugin/v1
id: dev.mcpg.backend.sftp
name: SFTP Binding
license: Apache-2.0
description: |
  Lists a directory, gets a file, or puts a file over SFTP (SSH file
  transfer) as MCP tools and resources. `op: list` returns directory entries;
  `op: get` returns a file's contents (text or base64); `op: put` writes a
  file from the `content`/`text` argument. The target path comes from the
  call arguments (`..` rejected) and is joined under the operator-configured
  `root`. Connects with russh + russh-sftp (pure-Rust SSH crypto); the
  password resolves through the gateway secret-resolver (`${env.X}` /
  `vault://...`). The ftp and smb backends cover the other file protocols.

  Set `surface: resource` to expose files as MCP RESOURCES instead of tools:
  `resources/list` lists the configured `root`/`path` directory (one resource
  per regular file — URI from the `uri` template `sftp://{path}`, name =
  filename, mimeType guessed from the extension, size as the description) and
  `resources/read` fetches a file as `{contents:[{uri,mimeType,text|blob}]}`
  (UTF-8 → `text`, binary → base64 `blob`). `{path}` completion is served from
  the directory listing. The default `surface: tool` keeps the list/get/put
  tools unchanged.

  A second `watch_strategy` entity (kind `sftp_dir_poll`) watches a directory
  by POLLING. Each watcher carries its own connection (`host` / `port` /
  `username` / `password` / `host_key_sha256` / `accept_unknown_host_key` /
  `root`) plus the `path` directory under `root` to watch. The plugin LISTS
  that directory (and its subdirectories with `recursive`, files filtered by
  an optional `pattern` glob) every `interval_ms` (default 60000, floored at
  250 ms) over one session with a `timeout_ms` budget (default 10000). A
  resource watch gets `notifications/resources/updated` whenever a file is
  added, removed, or modified; an MCP Events source gets each such file as the
  shared `object.changed` event and resumes exactly after a restart. The
  watched `path` is held to the same `..`-rejecting traversal guard as the
  backend; host-key verification fails closed (a pinned `host_key_sha256` or an
  explicit `accept_unknown_host_key: true`); a `cred://` password is rejected.
class: backend
runtime: native-cdylib-v1
protocol_version: "1.0"
required_capabilities: [network_outbound]
# MCP Events: the directory as an inventory of files.
watch_strategies:
  - kind: sftp_dir_poll
    placement: single_owner
    resume: true
    event_types:
      - name: object.changed
        description: A file in the watched SFTP directory was created, modified or deleted.
        payload_schema:
          type: object
          required: [op, store, location, key]
          properties:
            op: { enum: [created, modified, deleted] }
            store: { type: string, description: The kind of store - sftp here. }
            location: { type: string, description: "sftp://host:port/directory, without credentials." }
            key: { type: string, description: The file's path relative to location. }
            size: { type: integer }
            modifiedAt: { type: string, description: When it last changed, RFC 3339. }
